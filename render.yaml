services:
  - type: web
    name: PCCC-TROLYNGHIEPVU
    env: python
    plan: starter
    rootDir: backend
    buildCommand: "pip install -r requirements.txt"
    # Migration KHONG chay tu dong luc web instance start (xem docs/04-migration-runbook.md) -
    # chay "flask db upgrade" thu cong 1 lan qua Render Shell truoc khi trien khai release
    # co doi schema, tranh nhieu instance cung chay migration dong thoi khi scale > 1 instance.
    startCommand: "gunicorn run:app --bind 0.0.0.0:$PORT --timeout 900"
    envVars:
      - key: FLASK_APP
        value: run:app
      - key: SECRET_KEY
        generateValue: true
      - key: AI_PROVIDER
        value: claude
      - key: ANTHROPIC_MODEL
        value: claude-sonnet-5
      - key: AIHO_DAILY_QUOTA
        value: "5"
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: GEMINI_API_KEY
        sync: false
