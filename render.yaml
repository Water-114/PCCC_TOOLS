services:
  - type: web
    name: PCCC-TROLYNGHIEPVU
    env: python
    plan: starter
    rootDir: backend
    buildCommand: "pip install -r requirements.txt"
    # Migration KHONG chay tu dong luc web instance start (xem docs/04-migration-runbook.md) -
    # chay "flask db upgrade" thu cong 1 lan qua Render Shell truoc khi trien khai release
    # co doi schema, tranh nhieu instance cung chay migration dong thoi khi scale > 1 instance.
    # 1 worker (process) x 8 thread (gthread) = toi da 8 request dong thoi.
    # DA TUNG DUNG "--workers 2 --threads 4" (2026-08-02) nhung gay OOM THAT
    # tren production cung ngay: Render bao "Ran out of memory (used over
    # 512MB)" 3 lan (23:37, 23:53, 05:48), dung luc 4 nguoi dung goi AI dong
    # thoi (goi 4 hang muc cung 1 luot) - moi worker la 1 tien trinh Python
    # DAY DU (Flask + SQLAlchemy + SDK Anthropic/Gemini...), 2 worker gan nhu
    # gap doi bo nho nen tren goi Render "starter" (RAM 512MB), khong con du
    # cho xu ly request that. Sua lai con 1 worker (chi 1 lan bo nho nen) +
    # 8 thread (van giu dung 8 cho xu ly dong thoi nhu cu, thread chia se bo
    # nho voi nhau re hon nhieu process rieng). AI call la I/O-bound (cho
    # mang) nen thread van hieu qua. Circuit breaker (resilience.py) da dung
    # threading.Lock nen an toan khi nhieu thread dung chung 1 worker.
    startCommand: "gunicorn run:app --bind 0.0.0.0:$PORT --timeout 900 --workers 1 --threads 8 --worker-class gthread"
    envVars:
      - key: FLASK_APP
        value: run:app
      - key: SECRET_KEY
        generateValue: true
      - key: AI_PROVIDER
        value: claude
      - key: ANTHROPIC_MODEL
        value: claude-sonnet-5
      - key: AIHO_DAILY_QUOTA
        value: "5"
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: GEMINI_API_KEY
        sync: false
