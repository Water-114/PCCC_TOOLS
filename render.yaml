services:
  - type: web
    name: pccc-tuvan
    env: python
    plan: starter
    rootDir: backend
    buildCommand: "pip install -r requirements.txt"
    startCommand: "flask db upgrade && gunicorn run:app --bind 0.0.0.0:$PORT --timeout 600"
    envVars:
      - key: FLASK_APP
        value: run:app
      - key: SECRET_KEY
        generateValue: true
      - key: AI_PROVIDER
        value: claude
      - key: ANTHROPIC_MODEL
        value: claude-sonnet-5
      - key: AIHO_DAILY_QUOTA
        value: "5"
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: GEMINI_API_KEY
        sync: false
